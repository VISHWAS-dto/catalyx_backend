spring.application.name=catalyx-backend

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/catalyx_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:changeThisDevOnlySecretKeyMustBeAtLeast256BitsLong!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File uploads
app.upload.base-dir=${APP_UPLOAD_BASE_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
